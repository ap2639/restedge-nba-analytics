name: Refresh current season

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-current-season
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Refresh validated current-season data
        run: >-
          python scripts/update_season.py
          --season 2026-27
          --data-root data/season_store
          --timeout 45
          --attempts 3
          --retry-delay-seconds 15
          --keep-existing-on-source-unavailable
      - name: Commit refreshed processed data
        run: |
          git config user.name "restedge-data-bot"
          git config user.email "restedge-data-bot@users.noreply.github.com"
          git add data/season_store/processed data/season_store/metadata
          if git diff --cached --quiet; then
            echo "No validated data changes to publish."
            exit 0
          fi
          git commit -m "data: refresh 2026-27 season"
          git pull --rebase origin main
          git push origin HEAD:main


name: Refresh current season

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/update_season.py --season 2026-27 --data-root data/season_store
      - name: Commit refreshed processed data
        run: |
          git config user.name "restedge-data-bot"
          git config user.email "restedge-data-bot@users.noreply.github.com"
          git add data/season_store/processed data/season_store/metadata
          git diff --cached --quiet || git commit -m "data: refresh 2026-27 season"
          git push

